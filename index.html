    const sectionHead=(eyebrow,title,link)=>`<div class="mb-5 flex items-end justify-between gap-4"><div><p class="text-[10px] font-extrabold uppercase tracking-[.22em] text-emerald-700 dark:text-lime">${eyebrow}</p><h2 class="mt-2 font-display text-2xl font-semibold">${title}</h2></div>${link?`<button onclick="go('${link}')" class="text-xs font-extrabold text-emerald-700 dark:text-lime">Tout voir ↗</button>`:''}</div>`;

    let selectedMatchStatus = 'Tous';
    let selectedMatchQuery = '';

    function getMatchId(m, idx=0) {
      if (m.id !== undefined && m.id !== null) return String(m.id);
      const hStr = typeof m.home === 'string' ? m.home : (m.home.id || m.home.name || 'home');
      const aStr = typeof m.away === 'string' ? m.away : (m.away.id || m.away.name || 'away');
      const dStr = (m.date || 'date').toLowerCase().replace(/[^a-z0-9]/g, '');
      return `${dStr}-${hStr}-${aStr}-${idx}`;
    }

    function getAllMatchesFlattened() {
      const list = [];
      Object.keys(matchResultsBySeason).forEach(season => {
        (matchResultsBySeason[season] || []).forEach((m, idx) => {
          list.push({ ...m, season, matchId: getMatchId(m, idx) });
        });
      });
      return list;
    }

    function getMatchById(id) {
      const all = getAllMatchesFlattened();
      const cleanId = String(id).replace(/^match-/, '');
      const found = all.find(m => String(m.id) === cleanId || m.matchId === cleanId);
      if (found) return found;
      // Fallback to match 1
      return { ...matches[0], season: '2025-2026', matchId: '1' };
    }

    function resultRow(m, idx=0){
      const h = typeof m.home === 'string' ? clubMeta(m.home) : m.home;
      const a = typeof m.away === 'string' ? clubMeta(m.away) : m.away;
      const isLive = m.status === 'En direct';
      const isDone = m.status === 'Terminé';
      const mId = getMatchId(m, idx);

      const statusBadge = isLive

      const scoreHtml = m.status === 'Forfait'

           </div>`
        : m.hs === null

               <span class="font-mono text-xs font-black text-slate-500 dark:text-slate-400">${m.time || '15:30'}</span>

          : `<div class="rounded-xl border border-slate-200 bg-white px-4 py-1.5 text-center shadow-soft dark:border-white/10 dark:bg-[#111916]">

                 ${m.hs} <span class="text-slate-300 dark:text-white/20 text-xs px-0.5">–</span> ${m.as}
               </span>
             </div>`;

      return `
        <div 
          onclick="go('match-${mId}')" 
          class="group relative flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 sm:p-5 transition-all duration-200 hover:bg-slate-50/80 dark:hover:bg-white/5 border-b border-slate-100 dark:border-white/5 last:border-0 cursor-pointer"

              <div class="min-w-0">
                <p class="font-display text-xs sm:text-sm font-bold text-ink dark:text-white truncate group-hover:text-coral transition-colors">

          <!-- Statut et Action desktop -->

            ${statusBadge}

              <span>Feuille de match</span>
              <span class="group-hover:translate-x-0.5 transition-transform">→</span>
            </span>
          </div>
        </div>
      `;

    function groupedResults(rows){
      const groups = [];
      rows.forEach((match, idx) => {
        let group = groups.find(x => x.name === match.group);
        if(!group){ group = { name: match.group, days: [] }; groups.push(group); }
        let day = group.days.find(x => x.name === match.round);
        if(!day){ day = { name: match.round, matches: [] }; group.days.push(day); }
        day.matches.push({ ...match, _idx: idx });
      });

      return groups.map(group => `
        <section class="mb-8 overflow-hidden rounded-3xl border border-slate-200/80 bg-white shadow-soft dark:border-white/10 dark:bg-[#19241f]">
          <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 bg-slate-50/90 px-5 py-4 dark:border-white/5 dark:bg-black/30">

          ${group.days.map(day => `
            <div>
              <div class="border-b border-slate-100 bg-slate-50/40 px-5 py-2.5 text-[10px] font-black uppercase tracking-widest text-slate-400 dark:border-white/5 dark:bg-white/2">
                ${day.name}
              </div>
              <div class="divide-y divide-slate-100 dark:divide-white/5">
                ${day.matches.map(m => resultRow(m, m._idx)).join('')}
              </div>
            </div>
          `).join('')}
        </section>
      `).join('');
    }

    function matchesPage(){
      const all = (matchResultsBySeason[selectedMatchSeason] || []).map((m, idx) => ({ ...m, id: m.id || `${selectedMatchSeason}-${idx}` }));
      
      const filtered = all.filter(m => {
        const matchesGroup = selectedMatchGroup === 'Tous les groupes' || m.group === selectedMatchGroup;
        const matchesStatus = selectedMatchStatus === 'Tous' || m.status === selectedMatchStatus;
        const hName = (typeof m.home === 'string' ? m.home : (m.home.name || '')).toLowerCase();
        const aName = (typeof m.away === 'string' ? m.away : (m.away.name || '')).toLowerCase();
        const q = (selectedMatchQuery || '').trim().toLowerCase();
        const matchesSearch = !q || hName.includes(q) || aName.includes(q) || (m.round || '').toLowerCase().includes(q) || (m.stadium || '').toLowerCase().includes(q);
        return matchesGroup && matchesStatus && matchesSearch;
      });

      // Calcul des statistiques rapides de la saison
      const playedMatches = all.filter(m => m.status === 'Terminé' && m.hs !== null && m.as !== null);
      const totalGoals = playedMatches.reduce((acc, m) => acc + (Number(m.hs) || 0) + (Number(m.as) || 0), 0);
      const goalsPerMatch = playedMatches.length ? (totalGoals / playedMatches.length).toFixed(1) : '—';

      return `
        <div class="mb-8">
          <div class="mb-6 max-w-3xl">
            <span class="inline-flex items-center gap-1.5 rounded-full border border-coral/30 bg-coral/10 px-3 py-1 text-[10px] font-extrabold uppercase tracking-widest text-coral dark:border-lime/30 dark:bg-lime/10 dark:text-lime">
              <span class="inline-block h-1.5 w-1.5 rounded-full bg-coral dark:bg-lime animate-pulse"></span>
              COMPÉTITION · RÉSULTATS OFFICIELS
            </span>
            <h1 class="mt-3 font-display text-3xl font-extrabold tracking-tight sm:text-5xl text-ink dark:text-white">
              Résultats & Calendrier de la Ligue 1
            </h1>
            <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-600 dark:text-slate-300 sm:text-base">

            </p>
          </div>

          <!-- Cartes statistiques de synthèse -->
          <div class="mb-8 grid grid-cols-2 gap-3 sm:grid-cols-4 sm:gap-5">
            <div class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-soft dark:border-white/10 dark:bg-[#19241f]">
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 block">Rencontres</span>
              <b class="font-display text-2xl sm:text-3xl font-black text-ink dark:text-white mt-1 block">${all.length}</b>

              <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 block">Buts Marqués</span>

              <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 block">Moyenne Buts/Match</span>
              <b class="font-display text-2xl sm:text-3xl font-black text-ink dark:text-white mt-1 block">${goalsPerMatch}</b>
              <span class="text-[11px] text-slate-500">Par match terminé</span>
            </div>
            <div class="rounded-2xl border border-coral/30 bg-coral/5 p-4 shadow-soft dark:border-lime/30 dark:bg-lime/5">
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-coral dark:text-lime block flex items-center gap-1">
                ${icon('3d', 'h-3 w-3')} Match Center 3D
              </span>
              <b class="font-display text-lg sm:text-xl font-black text-ink dark:text-white mt-1 block truncate">Mazembe 2–1 Vita</b>
              <a href="Terrain Vivant.html" class="text-[11px] font-bold text-coral dark:text-lime hover:underline block mt-0.5">Lancer l'immersion 3D →</a>
            </div>
          </div>

          <!-- Filtres professionnels de recherche -->
          <div class="mb-8 rounded-2xl border border-slate-200 bg-white p-4 shadow-soft dark:border-white/10 dark:bg-[#19241f] space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <!-- Saison -->
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold uppercase tracking-widest text-slate-500">Saison :</span>

                  ${seasons.slice(0, 3).map(s => `<option ${selectedMatchSeason === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>

              <!-- Recherche rapide de club -->
              <div class="relative flex-1 max-w-xs">
                <span class="absolute left-3 top-2.5 text-slate-400">
                  ${icon('search', 'h-3.5 w-3.5')}
                </span>
                <input 
                  type="text"
                  value="${esc(selectedMatchQuery)}"
                  placeholder="Filtrer un club (Mazembe, Vita...)"
                  oninput="filterMatchQuery(this.value)"
                  class="w-full rounded-xl border border-slate-200 bg-paper pl-8 pr-3 py-1.5 text-xs text-ink placeholder:text-slate-400 outline-none dark:border-white/10 dark:bg-black/30 dark:text-white"

            <!-- Groupes & Statuts -->
            <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-3 dark:border-white/5">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[10px] font-extrabold uppercase text-slate-400 mr-1">Groupe :</span>

                  <button 
                    onclick="changeMatchGroup('${g}')" 
                    class="rounded-lg px-3 py-1.5 text-xs font-bold transition ${selectedMatchGroup === g ? 'bg-coral text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-white/10 dark:text-slate-300 dark:hover:bg-white/15'}"
                  >
                    ${g}
                  </button>
                `).join('')}
              </div>

              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[10px] font-extrabold uppercase text-slate-400 mr-1">Statut :</span>
                ${['Tous', 'Terminé', 'À venir', 'En direct'].map(st => `
                  <button 
                    onclick="changeMatchStatus('${st}')" 
                    class="rounded-lg px-2.5 py-1 text-xs font-bold transition ${selectedMatchStatus === st ? 'bg-ink text-white dark:bg-lime dark:text-ink' : 'bg-slate-100 text-slate-500 hover:text-ink dark:bg-white/5 dark:text-slate-400'}"
                  >
                    ${st}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="mb-4 flex items-center justify-between text-xs text-slate-500">
            <p class="font-bold">${filtered.length} rencontre${filtered.length > 1 ? 's' : ''} affichée${filtered.length > 1 ? 's' : ''}</p>
            <span class="rounded-full bg-slate-100 px-3 py-1 font-bold text-slate-600 dark:bg-white/10 dark:text-slate-400">

        ${filtered.length ? groupedResults(filtered) : `

            </button>
          </div>
        `}
      `;

    function changeMatchSeason(season){ selectedMatchSeason=season; selectedMatchGroup='Tous les groupes'; selectedMatchStatus='Tous'; localStorage.setItem('lcl-match-season',season); render(); }
    function changeMatchGroup(group){ selectedMatchGroup=group; render(); }
    function changeMatchStatus(status){ selectedMatchStatus=status; render(); }
    function filterMatchQuery(q){ selectedMatchQuery=q; render(); }
    function resetMatchFilters(){ selectedMatchGroup='Tous les groupes'; selectedMatchStatus='Tous'; selectedMatchQuery=''; render(); }

    function matchDetailPage(matchId) {
      const m = getMatchById(matchId);
      const h = clubMeta(m.home);
      const a = clubMeta(m.away);
      const isDone = m.status === 'Terminé';
      const isLive = m.status === 'En direct';

      // Données de feuille de match enrichies
      const timeline = m.timeline || (isDone ? [
        { min: "23'", team: 'home', player: h.name.includes('Mazembe') ? 'Glody Likonza' : 'Attaquant', type: 'goal', desc: 'Ouverture du score sur une frappe limpide.' },
        { min: "45'", team: 'away', player: 'Milieu de terrain', type: 'card', desc: 'Carton jaune pour anti-jeu.' },
        ...(m.as > 0 ? [{ min: "58'", team: 'away', player: 'Attaquant', type: 'goal', desc: 'Égalisation sur un centre en retrait parfait.' }] : []),
        ...(m.hs > 1 ? [{ min: "78'", team: 'home', player: 'Ailier droit', type: 'goal', desc: 'But de la victoire suite à une combinaison tactique.' }] : []),

    function highlightMatch(text, q) {
      if (!q || !text) return esc(text || '');
      const escapedText = esc(text);
      const escapedQ = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedQ})`, 'gi');
      return escapedText.replace(regex, '<mark class="bg-lime/30 text-ink dark:text-white rounded px-0.5 font-bold">$1</mark>');
    }

    function getSearchData(query) {
      const q = (query || '').trim().toLowerCase();
      const matchedClubs = clubs.filter(c => 
        !q || c.name.toLowerCase().includes(q) || c.short.toLowerCase().includes(q) || c.city.toLowerCase().includes(q) || c.stadium.toLowerCase().includes(q)
      );
      const matchedPlayers = players.filter(p => {
        const c = club(p.club);
        return !q || p.name.toLowerCase().includes(q) || p.position.toLowerCase().includes(q) || p.nationality.toLowerCase().includes(q) || c.name.toLowerCase().includes(q);
      });
      const matchedArticles = articles.filter(a =>
        !q || a.title.toLowerCase().includes(q) || (a.excerpt && a.excerpt.toLowerCase().includes(q)) || (a.cat && a.cat.toLowerCase().includes(q)) || (a.code && a.code.toLowerCase().includes(q))
      );
      const matchedMatches = matches.filter(m => {
        const h = club(m.home);
        const a = club(m.away);
        return !q || h.name.toLowerCase().includes(q) || a.name.toLowerCase().includes(q) || (m.stadium && m.stadium.toLowerCase().includes(q)) || (m.status && m.status.toLowerCase().includes(q));
      });
      const matchedTV = tv.filter(v =>
        !q || v.title.toLowerCase().includes(q) || (v.meta && v.meta.toLowerCase().includes(q)) || (v.type && v.type.toLowerCase().includes(q))
      );
      const matchedMagazines = magazines.filter(m =>
        !q || m.title.toLowerCase().includes(q) || (m.number && m.number.toLowerCase().includes(q)) || (m.theme && m.theme.toLowerCase().includes(q)) || (m.season && m.season.toLowerCase().includes(q))
      );
      const total = matchedClubs.length + matchedPlayers.length + matchedArticles.length + matchedMatches.length + matchedTV.length + matchedMagazines.length;
      return { clubs: matchedClubs, players: matchedPlayers, articles: matchedArticles, matches: matchedMatches, tv: matchedTV, magazines: matchedMagazines, total };
    }

    window.LCL_ADS = {
      slots: {},
      initSlot(slotId, total, intervalMs = 5500) {
        if (!this.slots[slotId]) {
          this.slots[slotId] = { index: 0, total, intervalMs, paused: false, timer: null };
        } else {
          this.slots[slotId].total = total;
          this.slots[slotId].index = 0;
          this.slots[slotId].paused = false;
        }
        const card = document.getElementById(slotId);
        if (card && !card.dataset.touchAttached) {
          card.dataset.touchAttached = 'true';
          let touchStartX = 0;
          card.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
          card.addEventListener('touchend', e => {
            const diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 40) {
              if (diff < 0) window.LCL_ADS.next(slotId);
              else window.LCL_ADS.prev(slotId);
            }
          }, { passive: true });
        }
        this.startTimer(slotId);
      },
      startTimer(slotId) {
        const s = this.slots[slotId];
        if (!s) return;
        this.stopTimer(slotId);
        const bar = document.getElementById(`${slotId}-prog`);
        if (bar) {
          bar.style.transition = 'none';
          bar.style.width = '0%';
          setTimeout(() => {
            if (s && !s.paused && bar) {
              bar.style.transition = `width ${s.intervalMs}ms linear`;
              bar.style.width = '100%';
            }
          }, 35);
        }
        s.timer = setInterval(() => {
          if (!s.paused) {
            this.next(slotId);
          }
        }, s.intervalMs);
      },
      stopTimer(slotId) {
        const s = this.slots[slotId];
        if (s && s.timer) {
          clearInterval(s.timer);
          s.timer = null;
        }
      },
      pause(slotId) {
        const s = this.slots[slotId];
        if (s) {
          s.paused = true;
          this.stopTimer(slotId);
          const bar = document.getElementById(`${slotId}-prog`);
          if (bar) bar.style.transition = 'none';
        }
      },
      resume(slotId) {
        const s = this.slots[slotId];
        if (s) {
          s.paused = false;
          this.startTimer(slotId);
        }
      },
      goTo(slotId, targetIndex) {
        const s = this.slots[slotId];
        if (!s) return;
        const nextIdx = (targetIndex + s.total) % s.total;
        s.index = nextIdx;
        const card = document.getElementById(slotId);
        if (!card) return;
        const slides = card.querySelectorAll('.ad-slide-item');
        slides.forEach((sl, idx) => {
          sl.classList.toggle('active', idx === nextIdx);
        });
        const counter = document.getElementById(`${slotId}-count`);
        if (counter) counter.textContent = `${nextIdx + 1} / ${s.total}`;
        const dots = document.getElementById(`${slotId}-dots`);
        if (dots) {
          [...dots.children].forEach((d, idx) => {
            d.classList.toggle('active', idx === nextIdx);
          });
        }
        if (!s.paused) this.startTimer(slotId);
      },
      next(slotId) {
        const s = this.slots[slotId];
        if (s) this.goTo(slotId, s.index + 1);
      },
      prev(slotId) {
        const s = this.slots[slotId];
        if (s) this.goTo(slotId, s.index - 1);
      },
      initAll() {
        document.querySelectorAll('[data-ad-slot="true"]').forEach(el => {
          const slotId = el.id;
          const count = parseInt(el.getAttribute('data-ad-count') || '3', 10);
          this.initSlot(slotId, count);
        });
      },
      clearAll() {
        Object.keys(this.slots).forEach(slotId => this.stopTimer(slotId));
        this.slots = {};
      }
    };

    let adSlotInstanceCounter = 0;
    function adSlot(type = 'leaderboard', customId = null, offset = null, count = 3) {
      adSlotInstanceCounter++;
      const isCompact = type === 'native';
      const pool = (liveEditorialContent.ads && liveEditorialContent.ads.length >= 3)
        ? liveEditorialContent.ads.filter(a => a.status === 'Active')
        : (window.LCL_SHARED_CONTENT.ads || []);
      
      const allAds = pool.length >= 3 ? pool : window.LCL_SHARED_CONTENT.ads;
      const slotId = customId || `ad-rotator-${adSlotInstanceCounter}`;
      const actualCount = Math.max(3, Math.min(count, allAds.length));
      const start = (offset !== null) ? (offset % allAds.length) : ((adSlotInstanceCounter * 3) % allAds.length);
      
      const slotAds = [];
      for (let i = 0; i < actualCount; i++) {
        slotAds.push(allAds[(start + i) % allAds.length]);
      }
      
      const slidesHtml = slotAds.map((ad, idx) => {
        const imgUrl = encodeURI(ad.image || 'PUB SITE/1.jfif');
        return `
          <div class="ad-slide-item ${idx === 0 ? 'active' : ''}" data-index="${idx}" onclick="window.open('${ad.link || 'https://illicocash.com/'}', '_blank')" title="${ad.title} · Ouvrir le site partenaire illicocash">

            <div class="ad-slide-overlay">
              <div class="ad-slide-text">
                <span class="ad-slide-kicker">${ad.kicker || 'Partenaire Officiel'}</span>
                <strong class="ad-slide-title">${ad.title}</strong>
                <span class="ad-slide-copy">${ad.copy || ''}</span>
              </div>
              <a href="${ad.link || 'https://illicocash.com/'}" target="_blank" rel="noopener noreferrer" class="ad-slide-cta" onclick="event.stopPropagation()">
                Découvrir ↗
              </a>
            </div>
          </div>
        `;
      }).join('');
      
      const dotsHtml = slotAds.map((_, idx) => `
        <button type="button" class="ad-rotator-dot ${idx === 0 ? 'active' : ''}" onclick="window.LCL_ADS.goTo('${slotId}', ${idx})" aria-label="Afficher publicité ${idx + 1} sur ${actualCount}"></button>
      `).join('');
      
      return `
        <section class="ad-slot-rotator ${isCompact ? 'ad-slot-compact' : ''}" id="${slotId}" data-ad-slot="true" data-ad-count="${actualCount}" onmouseenter="window.LCL_ADS.pause('${slotId}')" onmouseleave="window.LCL_ADS.resume('${slotId}')" aria-label="Espace Publicitaire Partenaire">
          <div class="ad-rotator-frame">
            ${slidesHtml}
            <div class="ad-rotator-topbar">
              <div class="ad-brand-pill">
                <span class="ad-pulse-dot"></span>
                <span class="ad-brand-label">PUBLICITÉ · PARTENAIRE OFFICIEL</span>
              </div>
              <div class="ad-controls-group">
                <span class="ad-counter-badge" id="${slotId}-count">1 / ${actualCount}</span>
                <div class="ad-nav-arrows">
                  <button type="button" class="ad-arrow-btn" onclick="window.LCL_ADS.prev('${slotId}')" aria-label="Publicité précédente">‹</button>
                  <button type="button" class="ad-arrow-btn" onclick="window.LCL_ADS.next('${slotId}')" aria-label="Publicité suivante">›</button>
                </div>
              </div>
            </div>
            <div class="ad-rotator-bottombar">
              <div class="ad-rotator-dots" id="${slotId}-dots">
                ${dotsHtml}
              </div>
              <span class="ad-rotator-tag">illicocash by Rawbank</span>
            </div>
            <div class="ad-progress-track">
              <div class="ad-progress-bar" id="${slotId}-prog"></div>
            </div>
          </div>
        </section>
      `;
    }

    function render(){

      adSlotInstanceCounter = 0;
      liveEditorialContent = window.LCL_SHARED_CONTENT ? window.LCL_SHARED_CONTENT.read() : { articles:[], tv:[], magazines:[], ads:[] };
      document.documentElement.classList.toggle('dark', dark);

      appRoot.innerHTML = shell(pageHtml);

      const contentRoot = document.getElementById('pageContentRoot');
      if (current === 'home') {
        const sections = contentRoot.querySelectorAll('section');
        if (sections.length > 0) {
          sections[0].insertAdjacentHTML('afterend', adSlot('leaderboard', 'ad-home-0', 0));
        }
        if (sections.length > 1) {
          sections[1].insertAdjacentHTML('afterend', adSlot('native', 'ad-home-1', 3));
        }
      } else {
        if (!contentRoot.querySelector('[data-ad-slot="true"]')) {
          contentRoot.insertAdjacentHTML('beforeend', adSlot('leaderboard', `ad-bottom-${current}`, Math.floor(Math.random() * 15)));
        }
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (window.LCL_ADS && window.LCL_ADS.initAll) window.LCL_ADS.initAll();
    }
    function go(id){ current=id; location.hash=id; render(); }
    function toggleTheme(){ dark=!dark; localStorage.setItem('lcl-theme',dark?'dark':'light'); render(); }
    function toggleSidebar(){ sidebarCollapsed=!sidebarCollapsed; localStorage.setItem('lcl-sidebar',sidebarCollapsed?'collapsed':'expanded'); render(); }
    function toggleMenu(){ document.getElementById('mobileMenu').classList.toggle('hidden'); }
    function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2200); }
    function searchList(q){ if(window.handleSearchInput) window.handleSearchInput(q); const el = document.getElementById('searchResults'); if(el) el.innerHTML = searchResults(q); }
    window.addEventListener('hashchange',()=>{ current=location.hash.slice(1)||'home'; render(); });
    document.addEventListener('keydown',(e)=>{
      if(!location.hash.startsWith('#magazine-')) return;
      if((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(e.key.toLowerCase())){
        e.preventDefault();
        toast('Consultation exclusive en ligne · Téléchargement et impression désactivés');
        return false;
      }
      if(e.key==='ArrowLeft'){ changeMagazinePage(-1); }
      else if(e.key==='ArrowRight'){ changeMagazinePage(1); }
    });
    render();
  </script>
<script>
  window.toggleMenu = function(force) {
    const menu = document.getElementById('mobileMenu');
    const hamburger = document.querySelector('[aria-label="Menu"]');
    if (!menu) return;
    const shouldOpen = force === false ? false : menu.classList.contains('hidden');
    if (shouldOpen) {
      menu.classList.remove('hidden', 'menu-closing');
      menu.classList.add('menu-panel');
      requestAnimationFrame(() => menu.classList.add('menu-open'));
    } else {
      menu.classList.remove('menu-open');
      menu.classList.add('menu-closing');
      setTimeout(() => { menu.classList.add('hidden'); menu.classList.remove('menu-panel', 'menu-closing'); }, 280);
    }
    if (hamburger) hamburger.classList.toggle('is-open', shouldOpen);
  };
  const mountResponsiveAccess = () => {
    const hamburger = document.querySelector('[aria-label="Menu"]');
    if (hamburger && !hamburger.dataset.animated) {
      hamburger.dataset.animated = 'true';
      hamburger.classList.add('hamburger-button');
      hamburger.textContent = '';
      hamburger.innerHTML = '<span></span><span></span><span></span>';
    }
    const profileLink = [...document.querySelectorAll('button')].find(button => button.textContent.trim() === 'Mon espace');
    if (profileLink && !document.querySelector('a[href="login.html"]')) {
      const adminLink = document.createElement('a');
      adminLink.href = 'login.html';
      adminLink.textContent = '⚙';
      adminLink.setAttribute('aria-label', 'Administration');
      adminLink.title = 'Administration';
      adminLink.className = 'rounded-lg p-2 text-lg text-slate-600 transition hover:bg-white hover:text-coral dark:text-slate-300 dark:hover:bg-white/10';
      profileLink.before(adminLink);
    }
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenu && !mobileMenu.querySelector('[data-mobile-profile]')) {
      const mobileProfile = document.createElement('button');
      mobileProfile.type = 'button';
      mobileProfile.dataset.mobileProfile = 'true';
      mobileProfile.textContent = '♙  Mon espace';
      mobileProfile.className = 'col-span-2 rounded-lg px-3 py-2 text-left text-sm font-bold hover:bg-white dark:hover:bg-white/10';
      mobileProfile.onclick = () => { toggleMenu(false); go('profile'); };
      mobileMenu.firstElementChild.append(mobileProfile);
    }
  };
  mountResponsiveAccess();
  new MutationObserver(mountResponsiveAccess).observe(document.body, { childList: true, subtree: true });
</script>
