    window.LCL_ADS = {
      slots: {},
      initSlot(slotId, total, intervalMs = 5500) {
        if (!this.slots[slotId]) {
          this.slots[slotId] = { index: 0, total, intervalMs, paused: false, timer: null };
        } else {
          this.slots[slotId].total = total;
          this.slots[slotId].index = 0;
          this.slots[slotId].paused = false;
        }
        const card = document.getElementById(slotId);
        if (card && !card.dataset.touchAttached) {
          card.dataset.touchAttached = 'true';
          let touchStartX = 0;
          card.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
          card.addEventListener('touchend', e => {
            const diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 40) {
              if (diff < 0) window.LCL_ADS.next(slotId);
              else window.LCL_ADS.prev(slotId);
            }
          }, { passive: true });
        }
        this.startTimer(slotId);
      },
      startTimer(slotId) {
        const s = this.slots[slotId];
        if (!s) return;
        this.stopTimer(slotId);
        const bar = document.getElementById(`${slotId}-prog`);
        if (bar) {
          bar.style.transition = 'none';
          bar.style.width = '0%';
          setTimeout(() => {
            if (s && !s.paused && bar) {
              bar.style.transition = `width ${s.intervalMs}ms linear`;
              bar.style.width = '100%';
            }
          }, 35);
        }
        s.timer = setInterval(() => {
          if (!s.paused) {
            this.next(slotId);
          }
        }, s.intervalMs);
      },
      stopTimer(slotId) {
        const s = this.slots[slotId];
        if (s && s.timer) {
          clearInterval(s.timer);
          s.timer = null;
        }
      },
      pause(slotId) {
        const s = this.slots[slotId];
        if (s) {
          s.paused = true;
          this.stopTimer(slotId);
          const bar = document.getElementById(`${slotId}-prog`);
          if (bar) bar.style.transition = 'none';
        }
      },
      resume(slotId) {
        const s = this.slots[slotId];
        if (s) {
          s.paused = false;
          this.startTimer(slotId);
        }
      },
      goTo(slotId, targetIndex) {
        const s = this.slots[slotId];
        if (!s) return;
        const nextIdx = (targetIndex + s.total) % s.total;
        s.index = nextIdx;
        const card = document.getElementById(slotId);
        if (!card) return;
        const slides = card.querySelectorAll('.ad-slide-item');
        slides.forEach((sl, idx) => {
          sl.classList.toggle('active', idx === nextIdx);
        });
        const counter = document.getElementById(`${slotId}-count`);
        if (counter) counter.textContent = `${nextIdx + 1} / ${s.total}`;
        const dots = document.getElementById(`${slotId}-dots`);
        if (dots) {
          [...dots.children].forEach((d, idx) => {
            d.classList.toggle('active', idx === nextIdx);
          });
        }
        if (!s.paused) this.startTimer(slotId);
      },
      next(slotId) {
        const s = this.slots[slotId];
        if (s) this.goTo(slotId, s.index + 1);
      },
      prev(slotId) {
        const s = this.slots[slotId];
        if (s) this.goTo(slotId, s.index - 1);
      },
      initAll() {
        document.querySelectorAll('[data-ad-slot="true"]').forEach(el => {
          const slotId = el.id;
          const count = parseInt(el.getAttribute('data-ad-count') || '3', 10);
          this.initSlot(slotId, count);
        });
      },
      clearAll() {
        Object.keys(this.slots).forEach(slotId => this.stopTimer(slotId));
        this.slots = {};
      }
    };

    let adSlotInstanceCounter = 0;
    function adSlot(type = 'leaderboard', customId = null, offset = null, count = 3) {
      adSlotInstanceCounter++;
      const isCompact = type === 'native';
      const pool = (liveEditorialContent.ads && liveEditorialContent.ads.length >= 3)
        ? liveEditorialContent.ads.filter(a => a.status === 'Active')
        : (window.LCL_SHARED_CONTENT.ads || []);
      
      const allAds = pool.length >= 3 ? pool : window.LCL_SHARED_CONTENT.ads;
      const slotId = customId || `ad-rotator-${adSlotInstanceCounter}`;
      const actualCount = Math.max(3, Math.min(count, allAds.length));
      const start = (offset !== null) ? (offset % allAds.length) : ((adSlotInstanceCounter * 3) % allAds.length);
      
      const slotAds = [];
      for (let i = 0; i < actualCount; i++) {
        slotAds.push(allAds[(start + i) % allAds.length]);
      }
      
      const slidesHtml = slotAds.map((ad, idx) => {
        const imgUrl = encodeURI(ad.image || 'PUB SITE/1.jfif');
        return `
          <div class="ad-slide-item ${idx === 0 ? 'active' : ''}" data-index="${idx}" onclick="window.open('${ad.link || 'https://illicocash.com/'}', '_blank')" title="${ad.title} · Ouvrir le site partenaire illicocash">
            <img src="${imgUrl}" alt="${ad.title}" class="ad-slide-img" loading="lazy">
            <div class="ad-slide-gradient"></div>
            <div class="ad-slide-overlay">
              <div class="ad-slide-text">
                <span class="ad-slide-kicker">${ad.kicker || 'Partenaire Officiel'}</span>
                <strong class="ad-slide-title">${ad.title}</strong>
                <span class="ad-slide-copy">${ad.copy || ''}</span>
              </div>
              <a href="${ad.link || 'https://illicocash.com/'}" target="_blank" rel="noopener noreferrer" class="ad-slide-cta" onclick="event.stopPropagation()">
                Découvrir ↗
              </a>
            </div>
          </div>
        `;
      }).join('');
      
      const dotsHtml = slotAds.map((_, idx) => `
        <button type="button" class="ad-rotator-dot ${idx === 0 ? 'active' : ''}" onclick="window.LCL_ADS.goTo('${slotId}', ${idx})" aria-label="Afficher publicité ${idx + 1} sur ${actualCount}"></button>
      `).join('');
      
      return `
        <section class="ad-slot-rotator ${isCompact ? 'ad-slot-compact' : ''}" id="${slotId}" data-ad-slot="true" data-ad-count="${actualCount}" onmouseenter="window.LCL_ADS.pause('${slotId}')" onmouseleave="window.LCL_ADS.resume('${slotId}')" aria-label="Espace Publicitaire Partenaire">
          <div class="ad-rotator-frame">
            ${slidesHtml}
            <div class="ad-rotator-topbar">
              <div class="ad-brand-pill">
                <span class="ad-pulse-dot"></span>
                <span class="ad-brand-label">PUBLICITÉ · PARTENAIRE OFFICIEL</span>
              </div>
              <div class="ad-controls-group">
                <span class="ad-counter-badge" id="${slotId}-count">1 / ${actualCount}</span>
                <div class="ad-nav-arrows">
                  <button type="button" class="ad-arrow-btn" onclick="window.LCL_ADS.prev('${slotId}')" aria-label="Publicité précédente">‹</button>
                  <button type="button" class="ad-arrow-btn" onclick="window.LCL_ADS.next('${slotId}')" aria-label="Publicité suivante">›</button>
                </div>
              </div>
            </div>
            <div class="ad-rotator-bottombar">
              <div class="ad-rotator-dots" id="${slotId}-dots">
                ${dotsHtml}
              </div>
              <span class="ad-rotator-tag">illicocash by Rawbank</span>
            </div>
            <div class="ad-progress-track">
              <div class="ad-progress-bar" id="${slotId}-prog"></div>
            </div>
          </div>
        </section>
      `;
    }

    function render(){
      if(window.LCL_ADS && window.LCL_ADS.clearAll) window.LCL_ADS.clearAll();
      adSlotInstanceCounter = 0;
      liveEditorialContent = window.LCL_SHARED_CONTENT ? window.LCL_SHARED_CONTENT.read() : { articles:[], tv:[], magazines:[], ads:[] };
      document.documentElement.classList.toggle('dark', dark);

      // Render page
      const pageHtml = page(current);
      const appRoot = document.getElementById('app');
      appRoot.innerHTML = shell(pageHtml);

      const contentRoot = document.getElementById('pageContentRoot');
      if (current === 'home') {
        const sections = contentRoot.querySelectorAll('section');
        if (sections.length > 0) {
          sections[0].insertAdjacentHTML('afterend', adSlot('leaderboard', 'ad-home-0', 0));
        }
        if (sections.length > 1) {
          sections[1].insertAdjacentHTML('afterend', adSlot('native', 'ad-home-1', 3));
        }
      } else {
        if (!contentRoot.querySelector('[data-ad-slot="true"]')) {
          contentRoot.insertAdjacentHTML('beforeend', adSlot('leaderboard', `ad-bottom-${current}`, Math.floor(Math.random() * 15)));
        }
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (window.LCL_ADS && window.LCL_ADS.initAll) window.LCL_ADS.initAll();
      if (current.startsWith('match-')) {
        setTimeout(() => { if (window.initMatchLens) window.initMatchLens(current.slice(6)); }, 40);
      } else {
        if (window.destroyMatchLens) window.destroyMatchLens();
      }
    }
    function go(id){ current=id; location.hash=id; render(); }
    function toggleTheme(){ dark=!dark; localStorage.setItem('lcl-theme',dark?'dark':'light'); render(); if (window.refreshMatchLensTheme) window.refreshMatchLensTheme(); }
    function toggleSidebar(){ sidebarCollapsed=!sidebarCollapsed; localStorage.setItem('lcl-sidebar',sidebarCollapsed?'collapsed':'expanded'); render(); }
    function toggleMenu(){ document.getElementById('mobileMenu').classList.toggle('hidden'); }
    function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2200); }
    function searchList(q){ if(window.handleSearchInput) window.handleSearchInput(q); const el = document.getElementById('searchResults'); if(el) el.innerHTML = searchResults(q); }
    window.addEventListener('hashchange',()=>{ current=location.hash.slice(1)||'home'; render(); });
    document.addEventListener('keydown',(e)=>{
      if(!location.hash.startsWith('#magazine-')) return;
      if((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(e.key.toLowerCase())){
        e.preventDefault();
        toast('Consultation exclusive en ligne · Téléchargement et impression désactivés');
        return false;
      }
      if(e.key==='ArrowLeft'){ changeMagazinePage(-1); }
      else if(e.key==='ArrowRight'){ changeMagazinePage(1); }
    });
    render();
  </script>
<script>
  window.toggleMenu = function(force) {
    const menu = document.getElementById('mobileMenu');
    const hamburger = document.querySelector('[aria-label="Menu"]');
    if (!menu) return;
    const shouldOpen = force === false ? false : menu.classList.contains('hidden');
    if (shouldOpen) {
      menu.classList.remove('hidden', 'menu-closing');
      menu.classList.add('menu-panel');
      requestAnimationFrame(() => menu.classList.add('menu-open'));
    } else {
      menu.classList.remove('menu-open');
      menu.classList.add('menu-closing');
      setTimeout(() => { menu.classList.add('hidden'); menu.classList.remove('menu-panel', 'menu-closing'); }, 280);
    }
    if (hamburger) hamburger.classList.toggle('is-open', shouldOpen);
  };
  const mountResponsiveAccess = () => {
    const hamburger = document.querySelector('[aria-label="Menu"]');
    if (hamburger && !hamburger.dataset.animated) {
      hamburger.dataset.animated = 'true';
      hamburger.classList.add('hamburger-button');
      hamburger.textContent = '';
      hamburger.innerHTML = '<span></span><span></span><span></span>';
    }
    const profileLink = [...document.querySelectorAll('button')].find(button => button.textContent.trim() === 'Mon espace');
    if (profileLink && !document.querySelector('a[href="login.html"]')) {
      const adminLink = document.createElement('a');
      adminLink.href = 'login.html';
      adminLink.textContent = '⚙';
      adminLink.setAttribute('aria-label', 'Administration');
      adminLink.title = 'Administration';
      adminLink.className = 'rounded-lg p-2 text-lg text-slate-600 transition hover:bg-white hover:text-coral dark:text-slate-300 dark:hover:bg-white/10';
      profileLink.before(adminLink);
    }
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenu && !mobileMenu.querySelector('[data-mobile-profile]')) {
      const mobileProfile = document.createElement('button');
      mobileProfile.type = 'button';
      mobileProfile.dataset.mobileProfile = 'true';
      mobileProfile.textContent = '♙  Mon espace';
      mobileProfile.className = 'col-span-2 rounded-lg px-3 py-2 text-left text-sm font-bold hover:bg-white dark:hover:bg-white/10';
      mobileProfile.onclick = () => { toggleMenu(false); go('profile'); };
      mobileMenu.firstElementChild.append(mobileProfile);
    }
  };
  mountResponsiveAccess();
  new MutationObserver(mountResponsiveAccess).observe(document.body, { childList: true, subtree: true });
</script>
</body>
</html>
