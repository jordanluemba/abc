ed-xl bg-[#e6f5fa] p-4"><b class="font-display text-2xl">'+data.matches.filter(x=>x.status==='À venir').length+'</b><p class="mt-2 text-xs font-bold">Matchs à venir</p><button onclick="go(\'matches\')" class="mt-4 text-[10px] font-extrabold uppercase tracking-wider text-coral">Planifier →</button></div><div class="rounded-xl bg-[#fbe8e8] p-4"><b class="font-display text-2xl">'+data.players.filter(x=>x.status==='Blessé').length+'</b><p class="mt-2 text-xs font-bold">Statuts à vérifier</p><button onclick="go(\'players\')" class="mt-4 text-[10px] font-extrabold uppercase tracking-wider text-coral">Vérifier →</button></div></div><div class="border-t border-slate-200 px-5 py-4 text-xs font-bold dark:border-white/10"><div class="flex justify-between"><span class="text-slate-500">Complétude de la base</span><span>'+Math.min(100,Math.round(total/1.1))+'%</span></div><div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-lime" style="width:'+Math.min(100,Math.round(total/1.1))+'%"></div></div></div></section><section class="rounded-2xl border border-slate-200 bg-white shadow-soft dark:border-white/10 dark:bg-[#192c31]"><div class="border-b border-slate-200 px-5 py-5 dark:border-white/10"><p class="text-[10px] font-extrabold uppercase tracking-[.18em] text-coral">Traçabilité</p><h3 class="mt-1 font-display text-xl font-semibold">Activité récente</h3></div><div class="divide-y divide-slate-100 px-5 dark:divide-white/10">'+logs.slice(0,4).map(l=>'<div class="flex gap-3 py-4"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-[#fff5dc] text-coral">✎</span><div><p class="text-xs font-bold leading-5">'+esc(l.text)+'</p><p class="mt-1 text-[10px] font-bold text-slate-400">'+esc(l.time)+'</p></div></div>').join('')+'</div></section></div>'};
function listPage(type){const s=schema[type],rows=data[type].filter(r=>!query||Object.values(r).some(v=>String(v).toLowerCase().includes(query.toLowerCase())));const heads=s.columns.map(k=>'<th class="px-4 py-3">'+esc(k==='title'?'Titre':k==='name'?'Nom':k==='home'?'Domicile':k==='away'?'Extérieur':k)+'</th>').join('');const body=rows.map(r=>'<tr class="border-b border-slate-100 last:border-0 hover:bg-[#fff8e8] dark:border-white/10 dark:hover:bg-[#183139]"><td class="px-4 py-4"><input type="checkbox" class="h-4 w-4 accent-coral"></td>'+s.columns.map(k=>'<td class="px-4 py-4 text-xs '+(['title','name'].includes(k)?'font-bold ':'')+'">'+(k==='status'?badge(r[k]):esc(r[k]||'—'))+'</td>').join('')+'<td class="px-4 py-4 text-right"><button onclick="openForm(\''+type+'\','+r.id+')" class="rounded-lg p-2 text-slate-500 hover:text-sky">✎</button><button onclick="removeRow(\''+type+'\','+r.id+')" class="rounded-lg p-2 text-slate-500 hover:text-coral">×</button></td></tr>').join('');return header('Gestion · '+s.label,s.label,'Créez, modifiez et publiez les '+s.label.toLowerCase()+' du site.',addButton(type))+'<section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-soft dark:border-white/10 dark:bg-[#192c31]"><div class="flex flex-wrap items-center gap-3 border-b border-slate-200 p-4 dark:border-white/10"><input class="field min-w-[220px] flex-1 py-2.5 text-xs" value="'+esc(query)+'" placeholder="Rechercher..." oninput="setQuery(this.value)"><select class="field w-auto py-2.5 text-xs" onchange="filterRows(this.value,\''+type+'\')"><option value="">Tous les statuts</option><option>Publié</option><option>Actif</option><option>Active</option><option>Brouillon</option><option>Archivé</option><option>À venir</option></select><span class="ml-auto text-xs font-bold text-slate-400">'+rows.length+' résultat(s)</span></div><div class="table-wrap"><table class="w-full min-w-[760px] text-left"><thead class="bg-[#f1f4f6] text-[10px] font-extrabold uppercase tracking-wider text-slate-500 dark:bg-[#102329]"><tr><th class="px-4 py-3"> </th>'+heads+'<th class="px-4 py-3 text-right">Actions</th></tr></thead><tbody>'+(body||'<tr><td colspan="'+(s.columns.length+2)+'" class="px-4 py-16 text-center text-sm font-bold text-slate-500">Aucun élément trouvé.</td></tr>')+'</tbody></table></div><div class="flex justify-between border-t border-slate-200 px-4 py-4 text-xs font-bold text-slate-400 dark:border-white/10"><span>Page 1 sur 1</span><span>Dernière synchronisation : à l’instant</span></div></section>'};
function form(type,row){const s=schema[type],fields=s.fields.map(([k,l,t,opts])=>'<label class="block '+(t==='textarea'?'sm:col-span-2':'')+'"><span class="mb-2 block text-xs font-extrabold">'+l+'</span>'+(t==='textarea'?'<textarea name="'+k+'" class="field min-h-28">'+esc(row[k]||'')+'</textarea>':t==='select'?'<select name="'+k+'" class="field">'+opts.map(o=>'<option '+(String(row[k]||opts[0])===o?'selected':'')+'>'+o+'</option>').join('')+'</select>':'<input name="'+k+'" type="'+t+'" class="field" value="'+esc(row[k]??'')+'">')+'</label>').join('');document.getElementById('modal').innerHTML='<div class="modal-bg fixed inset-0 z-40 flex items-end justify-center sm:items-center sm:p-5" onclick="closeModal(event)"><section class="w-full max-w-2xl rounded-t-2xl bg-white shadow-2xl dark:bg-[#192c31] sm:rounded-2xl" onclick="event.stopPropagation()"><div class="flex justify-between border-b border-slate-200 px-5 py-5 dark:border-white/10"><div><p class="text-[10px] font-extrabold uppercase tracking-[.2em] text-coral">'+(editing?'Modification':'Nouvel élément')+' · '+s.label+'</p><h2 class="mt-1 font-display text-xl font-semibold">'+(editing?'Modifier':'Ajouter')+' '+s.one+'</h2></div><button onclick="closeModal()" class="text-xl text-slate-400">×</button></div><form onsubmit="submitForm(event,\''+type+'\')"><div class="grid max-h-[65vh] gap-4 overflow-y-auto p-5 sm:grid-cols-2">'+fields+'</div><div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-4 dark:border-white/10"><button type="button" onclick="closeModal()" class="rounded-lg border border-slate-200 px-4 py-3 text-xs font-bold dark:border-white/10">Annuler</button><button class="rounded-lg bg-teal px-4 py-3 text-xs font-extrabold text-white dark:bg-lime dark:text-ink">Enregistrer</button></div></form></section></div>';}
function openForm(type,id){editing=id||null;form(type,id?data[type].find(r=>r.id===id):{});}function submitForm(e,type){e.preventDefault();const s=schema[type],fd=new FormData(e.target),values={};s.fields.forEach(([k,,t])=>values[k]=t==='number'?Number(fd.get(k)||0):String(fd.get(k)||''));if(editing){const i=data[type].findIndex(r=>r.id===editing);data[type][i]={...data[type][i],...values};log(s.label+' modifié · '+(values.title||values.name||values.home));toast('Modification enregistrée');}else{data[type].unshift({id:Date.now(),...values});log(s.label+' créé · '+(values.title||values.name||values.home));toast(s.one+' créé');}save();closeModal();render();}function removeRow(type,id){const s=schema[type],r=data[type].find(x=>x.id===id);if(r&&!confirm('Supprimer définitivement cet élément ?'))return;if(r){data[type]=data[type].filter(x=>x.id!==id);log(s.label+' supprimé · '+(r.title||r.name||r.home));save();toast('Élément supprimé');render();}}function log(text){logs.unshift({text,time:'À l’instant',type:'article'});logs=logs.slice(0,12);}function closeModal(e){if(!e||e.target===e.currentTarget)document.getElementById('modal').innerHTML='';}
function activity(){return header('Pilotage · traçabilité','Activité récente','Suivez les modifications réalisées sur la plateforme.')+'<section class="rounded-2xl border border-slate-200 bg-white shadow-soft dark:border-white/10 dark:bg-[#192c31]"><div class="border-b border-slate-200 px-5 py-5 dark:border-white/10"><h3 class="font-display text-xl font-semibold">Journal des opérations</h3></div><div class="divide-y divide-slate-100 dark:divide-white/10">'+logs.map(l=>'<div class="flex gap-4 px-5 py-4"><span class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#fff5dc] text-coral">✎</span><div><p class="text-sm font-bold">'+esc(l.text)+'</p><p class="mt-1 text-xs text-slate-400">'+esc(l.time)+'</p></div></div>').join('')+'</div></section>'};
function toast(message){const root=document.getElementById('toast');document.getElementById('toastText').textContent=message;root.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>root.classList.remove('show'),2200);}function render(){nav();const c=view==='overview'?overview():view==='activity'?activity():listPage(view);document.getElementById('content').innerHTML=c;document.getElementById('crumb').textContent=view==='overview'||view==='activity'?'Pilotage':schema[view].label;document.getElementById('heading').textContent=view==='overview'?'Vue d’ensemble':view==='activity'?'Activité récente':schema[view].label;}function go(v){view=v;query='';render();toggleMenu(false);}function setQuery(v){query=v;render();}function filterRows(v,type){const original=data[type];data[type]=original.filter(r=>!v||r.status===v);render();data[type]=original;}function globalSearch(v){if(!v)return;if(schema[view]){query=v;render();}}function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('lcl-dashboard-theme',document.documentElement.classList.contains('dark')?'dark':'light');}function toggleMenu(force){const side=document.getElementById('sidebar'),shade=document.getElementById('shade'),open=force===false?false:!side.classList.contains('open');side.classList.toggle('open',open);shade.classList.toggle('hidden',!open);}if(localStorage.getItem('lcl-dashboard-theme')==='dark')document.documentElement.classList.add('dark');render();
</script>
<script>
  const applySidebarLayout = () => {
    const main = document.getElementById('dashboardMain');
    const sidebar = document.getElementById('sidebar');
    if (!main) return;
    const desktop = window.matchMedia('(min-width: 1024px)').matches;
    const collapsed = document.body.classList.contains('sidebar-collapsed');
    main.style.setProperty('transition', 'none', 'important');
    main.style.setProperty('margin-left', desktop ? (collapsed ? '78px' : '270px') : '0px', 'important');
    if (sidebar) {
      sidebar.style.setProperty('transition', 'none', 'important');
      sidebar.style.setProperty('width', desktop ? (collapsed ? '78px' : '270px') : '', 'important');
    }
  };
  window.toggleSidebarCollapse = () => {
    document.body.classList.toggle('sidebar-collapsed');
    localStorage.setItem('lcl-dashboard-sidebar', document.body.classList.contains('sidebar-collapsed') ? 'collapsed' : 'expanded');
    const button = document.querySelector('.sidebar-collapse-button');
    if (button) {
      const collapsed = document.body.classList.contains('sidebar-collapsed');
      button.setAttribute('aria-label', collapsed ? 'Agrandir la sidebar' : 'Réduire la sidebar');
      button.title = collapsed ? 'Agrandir la sidebar' : 'Réduire la sidebar';
    }
    applySidebarLayout();
  };
  if (localStorage.getItem('lcl-dashboard-sidebar') === 'collapsed') document.body.classList.add('sidebar-collapsed');
  const sidebarButton = document.querySelector('.sidebar-collapse-button');
  if (sidebarButton && document.body.classList.contains('sidebar-collapsed')) {
    sidebarButton.setAttribute('aria-label', 'Agrandir la sidebar');
    sidebarButton.title = 'Agrandir la sidebar';
  }
  applySidebarLayout();
  window.addEventListener('resize', applySidebarLayout);
</script>
<script>
  const sharedEditorial = window.LCL_SHARED_CONTENT;
  const existingEditorialArticles = data.articles || [];
  data.articles = sharedEditorial.articles.map(item => {
    const previous = existingEditorialArticles.find(row => row.id === item.id || row.title === item.title);
    return { id:item.id, title:item.title, category:item.cat, date:item.isoDate, status:item.status, excerpt:item.excerpt, ...(previous || {}) };
  }).concat(existingEditorialArticles.filter(row => !sharedEditorial.articles.some(item => item.id === row.id || item.title === row.title)));
  const sharedMedia = [
    ...sharedEditorial.tv.map(item => ({id:`tv-${item.id}`,title:item.title,type:item.type,date:'2025-08-22',status:item.status,duration:item.meta.replace(/^.*· /,'')})),
    ...sharedEditorial.magazines.map(item => ({id:`mag-${item.id}`,title:`${item.number} · ${item.title}`,type:'Magazine',date:item.date,status:item.status,duration:`${item.contents} contenus`}))
  ];
  const existingMedia = data.media || [];
  data.media = sharedMedia.map(item => ({...item,...(existingMedia.find(row => row.title === item.title) || {})})).concat(existingMedia.filter(row => !sharedMedia.some(item => item.title === row.title)));
  save();
  const originalOverview = overview;
  const editorialOverview = () => {
    const article = data.articles[0];
    const episode = data.media.find(item => item.type !== 'Magazine') || data.media[0];
    const magazine = data.media.find(item => item.type === 'Magazine') || data.media[1];
    const editorialCard = (iconName, label, title, meta, action, image) => `<article class="overflow-hidden rounded-xl border border-slate-200 dark:border-white/10"><div class="flex h-28 items-end bg-teal p-4 text-white" style="background-image:linear-gradient(0deg,#062b35dd,#062b3540),url('${image || ''}');background-position:center;background-size:cover"><span class="flex items-center gap-2 text-[10px] font-extrabold uppercase tracking-[.16em] text-lime">${ico(iconName)}${label}</span></div><div class="p-4"><h4 class="font-display text-sm font-semibold leading-5">${esc(title || 'Contenu à compléter')}</h4><p class="mt-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">${esc(meta || 'Brouillon')}</p><button onclick="go('${action}')" class="mt-4 text-[10px] font-extrabold uppercase tracking-wider text-coral">Gérer →</button></div></article>`;
    return originalOverview() + `<section class="mt-7 rounded-2xl border border-slate-200 bg-white p-5 shadow-soft dark:border-white/10 dark:bg-[#192c31] sm:p-6"><div class="flex flex-wrap items-end justify-between gap-3"><div><p class="flex items-center gap-2 text-[10px] font-extrabold uppercase tracking-[.18em] text-coral">${ico('media')} Édito & programmation</p><h3 class="mt-2 font-display text-xl font-semibold">Le même contenu, de la rédaction au site public.</h3></div><span class="text-xs font-bold text-slate-400">Source partagée · ${data.articles.length + data.media.length} contenus</span></div><div class="mt-5 grid gap-4 md:grid-cols-3">${editorialCard('article','Actualités',article?.title,article?.category || 'Article','articles',sharedEditorial.articles[0]?.image)}${editorialCard('media','Coulisses TV',episode?.title,episode?.duration || episode?.type,'media',sharedEditorial.tv[0]?.image)}${editorialCard('archive','Magazine',magazine?.title,magazine?.duration || magazine?.type,'media',sharedEditorial.magazines[0]?.cover)}</div></section>`;
  };
  overview = editorialOverview;
  render();
</script>
